<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式LINE案内</title>
    <style>
        body { margin: 0; padding: 0; background: #FFC0CB; text-align: center; font-family: sans-serif; }
        
        /* 案内画面を「ピンク」に強制固定 */
        #guide-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FFC0CB !important; /* ★絶対ピンクにする命令 */
            color: #C2185B; z-index: 9999; padding-top: 100px; 
        }
        .btn { display: inline-block; padding: 15px 30px; background: #06C755; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="guide-overlay">
        <h2 style="font-size: 24px;">【重要なお知らせ】</h2>
        <p>右上の「...」から<br>「ブラウザで開く」を押してください</p>
        <div style="font-size: 50px;">↗︎</div>
        
        <p onclick="this.parentElement.style.display='none'" style="text-decoration: underline; margin-top: 50px;">
            [ すでにブラウザで開いている方はここをタップ ]
        </p>
    </div>

    <h1>公式LINE登録</h1>
    <a href="https://lin.ee/XXXXXX" class="btn">友だち追加する</a>

</body>
</html>
