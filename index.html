<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE案内</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #ffffff; color: #333; margin: 0; }
        .btn { display: inline-block; padding: 18px 40px; background: #06C755; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 20px; margin-top: 20px; box-shadow: 0 4px 15px rgba(6,199,85,0.3); }
        
        /* 案内用ピンク画面（最初は隠す） */
        #guide-overlay { 
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FFEDF3; color: #C2185B; z-index: 9999; 
            padding-top: 120px; box-sizing: border-box;
        }

        .arrow { font-size: 70px; position: absolute; top: 10px; right: 30px; line-height: 1; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .instruction { font-size: 19px; line-height: 1.8; padding: 0 25px; font-weight: bold; }
        .highlight { background: #ffffff; padding: 2px 8px; border-radius: 5px; color: #C2185B; border: 2px solid #C2185B; }
        .close-btn { margin-top: 40px; color: #888; text-decoration: underline; font-size: 14px; cursor: pointer; padding: 15px; }
    </style>
</head>
<body>

    <div id="guide-overlay">
        <div class="arrow">↗︎</div>
        <div class="instruction">
            <p style="font-size: 24px; margin-bottom: 20px;">【🐈重要🐈】</p>
            <p>TikTok内ではお友達登録ができません😭</p>
            <p>右上の<span class="highlight">「...」</span>をタップして<br>
               <span class="highlight">「ブラウザで開く」</span><br>
               を選択してね😻
            </p>
            <div class="close-btn" onclick="closeOverlay()">
                🐈ブラウザで開いている方はこちら🐈
            </div>
        </div>
    </div>

    <h2>🐈さやかLINE友だち追加🐈</h2>
    <p>😻下のボタンをタップして登録してくね😻</p>
    
    <a href="https://ialoop.net/lineadd?ap=pnHlt5proV" class="btn">LINEで友だち追加</a>

    <script>
        const overlay = document.getElementById('guide-overlay');

        // ピンク画面を閉じる関数
        function closeOverlay() {
            overlay.style.display = 'none';
            // 「ブラウザで開いた」という記憶を保存（24時間有効）
            localStorage.setItem('opened_in_browser', 'true');
        }

        (function() {
            const ua = navigator.userAgent.toLowerCase();
            // 過去に「閉じる」を押したか、またはブラウザ移動の目印があるかチェック
            const isOpenedBefore = localStorage.getItem('opened_in_browser');
            const isExternal = window.location.search.indexOf('open=external') !== -1;

            // TikTokなどのアプリ内ブラウザ判定
            const isTikTok = ua.indexOf('tiktok') !== -1 || ua.indexOf('tt-jp') !== -1;
            const isApp = isTikTok || (ua.indexOf('iphone') !== -1 && ua.indexOf('safari') === -1);

            if (isApp && !isOpenedBefore && !isExternal) {
                // アプリ内かつ、まだ「閉じた」記憶がない場合のみピンク画面を出す
                overlay.style.display = 'block';
            } else {
                // それ以外（Safari/Chrome本体や、移動後）は出さない
                overlay.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
