<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式LINE案内</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #ffffff; color: #333; }
        .btn { display: inline-block; padding: 18px 40px; background: #06C755; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 20px; margin-top: 20px; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; z-index: 1000; padding-top: 100px; }
        .arrow { font-size: 60px; position: absolute; top: 10px; right: 20px; }
    </style>
</head>
<body>

    <h2>公式LINE友だち追加</h2>
    <p>下のボタンをタップして登録してください</p>
    
    <a href="https://ialoop.net/lineadd?ap=pnHlt5proV"btn">LINEで友だち追加</a>

    <div id="overlay">
        <div class="arrow">↗︎</div>
        <h3>【重要】</h3>
        <p>右上の「...」をタップして<br><strong>「ブラウザで開く」</strong>を<br>選択してください</p>
        <p>（SafariやChromeで開くと登録できます）</p>
    </div>

    <script>
        const ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('tiktok') !== -1) {
            document.getElementById('overlay').style.display = 'block';
        }
    </script>
</body>
</html>
