<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式LINE案内</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #ffffff; color: #333; margin: 0; }
        .btn { display: inline-block; padding: 18px 40px; background: #06C755; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 20px; margin-top: 20px; box-shadow: 0 4px 15px rgba(6,199,85,0.3); }
        
        /* 案内用オーバーレイ（ピンク）初期は非表示 */
        #guide-overlay { 
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FFEDF3; color: #C2185B; z-index: 9999; 
            padding-top: 120px; box-sizing: border-box;
        }

        .arrow { font-size: 70px; position: absolute; top: 10px; right: 30px; line-height: 1; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .instruction { font-size: 19px; line-height: 1.8; padding: 0 25px; font-weight: bold; }
        .highlight { background: #ffffff; padding: 2px 8px; border-radius: 5px; color: #C2185B; border: 2px solid #C2185B; }
        .close-btn { margin-top: 40px; color: #888; text-decoration: underline; font-size: 14px; cursor: pointer; padding: 15px; }
    </style>
</head>
<body>

    <div id="guide-overlay">
        <div class="arrow">↗︎</div>
        <div class="instruction">
            <p style="font-size: 24px; margin-bottom: 20px;">【重要】</p>
            <p>TikTok内では登録ができません。</p>
            <p>右上の<span class="highlight">「...」</span>をタップして<br>
               <span class="highlight">「ブラウザで開く」</span><br>
               を選択してください。
            </p>
            <div class="close-btn" onclick="document.getElementById('guide-overlay').style.display='none'">
                すでにブラウザで開いている方はこちら
            </div>
        </div>
    </div>

    <h2>公式LINE友だち追加</h2>
    <p>下のボタンをタップして登録してください</p>
    
    <a href="https://ialoop.net/lineadd?ap=pnHlt5proV" class="btn">LINEで友だち追加</a>

    <script>
        (function() {
            const ua = navigator.userAgent.toLowerCase();
            // 目印があるかチェック
            const isAlreadyOpened = window.location.search.indexOf('open=external') !== -1;
            
            // TikTok、またはその他のアプリ内ブラウザ（Safari/Chrome本体以外）を広く判定
            const isApp = ua.indexOf('tiktok') !== -1 || 
                          ua.indexOf('tt-jp') !== -1 || 
                          ua.indexOf('iphone') !== -1 && ua.indexOf('safari') === -1 ||
                          ua.indexOf('android') !== -1 && ua.indexOf('version/') !== -1;

            const overlay = document.getElementById('guide-overlay');

            if (!isAlreadyOpened && isApp) {
                // アプリ内かつ目印なしならピンク画面を表示
                overlay.style.display = 'block';

                // Androidなら自動遷移
                if (ua.indexOf('android') !== -1) {
                    const separator = window.location.href.indexOf('?') === -1 ? '?' : '&';
                    const targetUrl = (window.location.href + separator + 'open=external').replace(/https?:\/\//, "");
                    window.location.href = 'intent://' + targetUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
                }
            }
        })();
    </script>
</body>
</html>
